name: Website Factory Deploy

on:
  push:
    branches:
      - main

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Website Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Website factory output verified"
